name: Apple prototype screenshot

'on':
  push:
    branches: [dev/apple]
    paths:
      - 'apple/**'
      - '.github/workflows/apple-prototype.yml'

permissions:
  contents: read

concurrency:
  group: apple-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    # Standalone experimental device candidates (head commit carries
    # '[apple-device-experimental]') opt out of this job; normal gates are
    # unchanged for all other pushes.
    if: github.repository == 'cortig00/OpenJump' && github.ref == 'refs/heads/dev/apple' && !contains(github.event.head_commit.message, '[apple-device-experimental]')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate local CI helper contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apple/ci -p 'test*.py' -v
      - name: Initialize concise artifact summary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-artifacts"
          printf 'Apple prototype evidence; PASS means only the named gate passed.\n' > "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Verify supported host tools
        id: host
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 16.0'
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcrun --sdk iphonesimulator --show-sdk-version | grep -Fx '18.0'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 26.0.1'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcrun --sdk iphonesimulator --show-sdk-version | grep -Fx '26.0'
          JAVA_HOME="$(/usr/libexec/java_home -F -v 21)"
          "$JAVA_HOME/bin/java" -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
      - name: Run shared Kotlin math JVM tests
        id: jvm
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -p apple/spikes/jump-core jvmTest
          printf 'JVM shared-math tests: PASS\n' >> "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Build Kotlin static framework with Kotlin/Xcode 16 pair
        id: framework
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -p apple/spikes/jump-core linkDebugFrameworkIosSimulatorArm64
          test -d apple/spikes/jump-core/build/bin/iosSimulatorArm64/debugFramework/JumpCoreSpike.framework
          test "$(xcrun lipo -archs apple/spikes/jump-core/build/bin/iosSimulatorArm64/debugFramework/JumpCoreSpike.framework/JumpCoreSpike)" = arm64
          printf 'Kotlin 2.1.20 static iOS simulator framework (Xcode 16.0): PASS\n' >> "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Build Swift consumer and test bundles (compile only)
        id: native_build
        timeout-minutes: 8
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/apple/spikes/jump-core/build/bin/iosSimulatorArm64/debugFramework"
          python3 apple/ci/run_command.py --timeout 420 -- xcodebuild build-for-testing \
            -project apple/OpenJumpApple.xcodeproj \
            -scheme OpenJumpApple \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/apple-derived" \
            JUMP_FRAMEWORK_DIR="$FRAMEWORK" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          printf 'Swift consumer and test bundles BUILD-FOR-TESTING: PASS (compiled; tests not run).\n' >> "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Create owned ephemeral iPhone 17 Pro simulator (iOS 26.0)
        id: simulator
        timeout-minutes: 3
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          python3 apple/ci/run_command.py --timeout 120 -- python3 apple/ci/select_simulator.py "$GITHUB_OUTPUT" --create-owned --receipt "$RUNNER_TEMP/apple-owned-simulator.json"
      - name: Boot owned ephemeral iPhone simulator
        id: boot
        timeout-minutes: 7
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          DEVICE='${{ steps.simulator.outputs.udid }}'
          python3 apple/ci/run_command.py --timeout 120 -- xcrun simctl boot "$DEVICE"
          python3 apple/ci/run_command.py --timeout 240 -- xcrun simctl bootstatus "$DEVICE" -b
      - name: Collect bounded read-only simulator readiness evidence
        id: simulator_diagnostics
        if: always() && steps.boot.conclusion == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          python3 apple/ci/diagnose_simulator.py --udid "$SIMULATOR_UDID" \
            --output "$RUNNER_TEMP/apple-simulator-diagnostics"
      - name: Run Swift bridge and simulator UI tests
        id: native_tests
        if: success() && steps.boot.conclusion == 'success'
        timeout-minutes: 8
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/OpenJumpApple-tests.xcresult"
          FRAMEWORK="$GITHUB_WORKSPACE/apple/spikes/jump-core/build/bin/iosSimulatorArm64/debugFramework"
          python3 apple/ci/run_command.py --timeout 420 -- xcodebuild test-without-building \
            -project apple/OpenJumpApple.xcodeproj \
            -scheme OpenJumpApple \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/apple-derived" \
            -resultBundlePath "$RESULT" \
            -parallel-testing-enabled NO \
            JUMP_FRAMEWORK_DIR="$FRAMEWORK" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          printf 'Swift bridge and UI XCTest runtime: PASS (real simulator execution).\n' >> "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Export verified XCTest screenshot attachments
        id: export
        if: success() && steps.native_tests.conclusion == 'success'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/OpenJumpApple-tests.xcresult"
          xcrun xcresulttool export attachments --path "$RESULT" --output-path "$RUNNER_TEMP/exported-attachments"
          count=0
          while IFS= read -r png; do
            cp "$png" "$RUNNER_TEMP/apple-artifacts/"
            count=$((count + 1))
            [ "$count" -lt 8 ] || break
          done < <(find "$RUNNER_TEMP/exported-attachments" -type f -name '*.png')
          test "$count" -gt 0
          printf 'Verified XCTest screenshot attachment PNG(s): %s (no app binary/full xcresult uploaded).\n' "$count" >> "$RUNNER_TEMP/apple-artifacts/summary.txt"
      - name: Delete owned ephemeral simulator (only job-created UUID)
        id: owned_cleanup
        # No this-job ownership output => no delete, even if a stale receipt exists.
        # Partial GITHUB_OUTPUT failure leaves an orphan for hosted VM disposal.
        if: always() && steps.simulator.outputs.owned == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          python3 apple/ci/run_command.py --timeout 60 -- python3 apple/ci/select_simulator.py --cleanup --receipt "$RUNNER_TEMP/apple-owned-simulator.json"
      - name: Record gate conclusions in job summary
        if: always()
        env:
          HOST: ${{ steps.host.conclusion }}
          JVM: ${{ steps.jvm.conclusion }}
          FRAMEWORK: ${{ steps.framework.conclusion }}
          BUILD: ${{ steps.native_build.conclusion }}
          DISCOVERY: ${{ steps.simulator.conclusion }}
          BOOT: ${{ steps.boot.conclusion }}
          DIAGNOSTICS: ${{ steps.simulator_diagnostics.outcome }}
          TESTS: ${{ steps.native_tests.conclusion }}
          EXPORT: ${{ steps.export.conclusion }}
          CLEANUP: ${{ steps.owned_cleanup.outcome }}
        run: |
          {
            echo '## Apple prototype gate evidence'
            echo '| Gate | Conclusion |'
            echo '|---|---|'
            echo "| Host tools | ${HOST:-not-run} |"
            echo "| JVM tests | ${JVM:-not-run} |"
            echo "| Kotlin framework/lipo | ${FRAMEWORK:-not-run} |"
            echo "| Swift consumer/test bundle build-for-testing (not runtime tests) | ${BUILD:-not-run} |"
            echo "| Owned ephemeral simulator creation (iPhone 17 Pro / iOS 26.0) | ${DISCOVERY:-not-run} |"
            echo "| Bounded simulator boot/readiness (created UUID only; boot 120s + bootstatus 240s) | ${BOOT:-not-run} |"
            echo "| Read-only readiness diagnostics (collection outcome, not health PASS) | ${DIAGNOSTICS:-not-run} |"
            echo "| Swift bridge/UI runtime tests | ${TESTS:-not-run} |"
            echo "| XCTest screenshot export | ${EXPORT:-not-run} |"
            echo "| Owned ephemeral cleanup (delete-only-created, not health PASS) | ${CLEANUP:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/apple-artifacts/summary.txt" ]; then cat "$RUNNER_TEMP/apple-artifacts/summary.txt" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RUNNER_TEMP/apple-simulator-diagnostics/report.txt" ]; then cat "$RUNNER_TEMP/apple-simulator-diagnostics/report.txt" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload bounded simulator readiness evidence only
        if: always() && steps.boot.conclusion == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simulator-readiness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-simulator-diagnostics/report.json
            ${{ runner.temp }}/apple-simulator-diagnostics/report.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Upload prototype screenshot artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone-prototype-${{ github.sha }}
          path: ${{ runner.temp }}/apple-artifacts/*
          if-no-files-found: error
          retention-days: 3

  device:
    needs: prototype
    if: github.repository == 'cortig00/OpenJump' && github.ref == 'refs/heads/dev/apple'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate local CI helper contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apple/ci -p 'test*.py' -v
      - name: Verify supported host tools for device build
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 16.0'
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcrun --sdk iphoneos --show-sdk-version | grep -Fx '18.0'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 26.0.1'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcrun --sdk iphoneos --show-sdk-version | grep -Fx '26.0'
          JAVA_HOME="$(/usr/libexec/java_home -F -v 21)"
          "$JAVA_HOME/bin/java" -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
      - name: Build Kotlin Release framework for iOS devices
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          set -euo pipefail
          python3 apple/ci/run_command.py --timeout 420 -- ./gradlew --no-daemon -p apple/spikes/jump-core linkReleaseFrameworkIosArm64
          test -d apple/spikes/jump-core/build/bin/iosArm64/releaseFramework/JumpCoreSpike.framework
          test "$(xcrun lipo -archs apple/spikes/jump-core/build/bin/iosArm64/releaseFramework/JumpCoreSpike.framework/JumpCoreSpike)" = arm64
      - name: Build unsigned Release app for generic iOS devices
        timeout-minutes: 8
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/apple/spikes/jump-core/build/bin/iosArm64/releaseFramework"
          python3 apple/ci/run_command.py --timeout 420 -- xcodebuild build \
            -project apple/OpenJumpApple.xcodeproj \
            -scheme OpenJumpApple \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/apple-device-derived" \
            JUMP_FRAMEWORK_DIR="$FRAMEWORK" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test -d "$RUNNER_TEMP/apple-device-derived/Build/Products/Release-iphoneos/OpenJumpApple.app"
      - name: Validate device binary and package unsigned IPA
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/apple-device-derived/Build/Products/Release-iphoneos/OpenJumpApple.app"
          OUT="$RUNNER_TEMP/apple-device-unsigned"
          mkdir -p "$OUT"
          python3 apple/ci/package_device_ipa.py \
            --app "$APP" \
            --ipa "$OUT/OpenJumpApple-unsigned.ipa" \
            --manifest "$OUT/manifest.json" \
            --sha256-file "$OUT/OpenJumpApple-unsigned.ipa.sha256" \
            --source-sha "$GITHUB_SHA"
          {
            echo '## iPhone device unsigned build'
            echo 'Unsigned Release IPA packaged; install requires the downloader own local signing. Physical-device test NOT_RUN.'
            cat "$OUT/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned device artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iPhone-device-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-device-unsigned/OpenJumpApple-unsigned.ipa
            ${{ runner.temp }}/apple-device-unsigned/manifest.json
            ${{ runner.temp }}/apple-device-unsigned/OpenJumpApple-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3
