name: Apple experimental device build

# Experimental manual device candidate only. Standalone device-only route;
# does NOT trigger normal CI and does NOT qualify native tests/physical runs.
# Trigger revision (phase 0, build 2): minimal SwiftUI compilation unblock;
# runs only for pushes to dev/apple touching this file with
# '[apple-device-experimental]' in the head commit message; the normal
# prototype/simulator gates opt out of such pushes.
'on':
  push:
    branches: [dev/apple]
    paths:
      - '.github/workflows/apple-device-experimental.yml'

permissions:
  contents: read

concurrency:
  group: apple-device-experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experimental_device:
    if: github.repository == 'cortig00/OpenJump' && github.ref == 'refs/heads/dev/apple' && contains(github.event.head_commit.message, '[apple-device-experimental]')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate local CI helper contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apple/ci -p 'test*.py' -v
      - name: Verify supported host tools for device build
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 16.0'
          DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer xcrun --sdk iphoneos --show-sdk-version | grep -Fx '18.0'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcodebuild -version | grep -Fx 'Xcode 26.0.1'
          DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer xcrun --sdk iphoneos --show-sdk-version | grep -Fx '26.0'
          JAVA_HOME="$(/usr/libexec/java_home -F -v 21)"
          "$JAVA_HOME/bin/java" -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
      - name: Run shared Kotlin math JVM tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          set -euo pipefail
          python3 apple/ci/run_command.py --timeout 420 -- ./gradlew --no-daemon -p apple/spikes/jump-core jvmTest
      - name: Build Kotlin Release framework for iOS devices
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          set -euo pipefail
          python3 apple/ci/run_command.py --timeout 420 -- ./gradlew --no-daemon -p apple/spikes/jump-core linkReleaseFrameworkIosArm64
          test -d apple/spikes/jump-core/build/bin/iosArm64/releaseFramework/JumpCoreSpike.framework
          test "$(xcrun lipo -archs apple/spikes/jump-core/build/bin/iosArm64/releaseFramework/JumpCoreSpike.framework/JumpCoreSpike)" = arm64
      - name: Build unsigned Release app for generic iOS devices
        timeout-minutes: 8
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          FRAMEWORK="$GITHUB_WORKSPACE/apple/spikes/jump-core/build/bin/iosArm64/releaseFramework"
          python3 apple/ci/run_command.py --timeout 420 -- xcodebuild build \
            -project apple/OpenJumpApple.xcodeproj \
            -scheme OpenJumpApple \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/apple-device-derived" \
            JUMP_FRAMEWORK_DIR="$FRAMEWORK" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test -d "$RUNNER_TEMP/apple-device-derived/Build/Products/Release-iphoneos/OpenJumpApple.app"
      - name: Validate device binary and package experimental unsigned IPA
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/apple-device-derived/Build/Products/Release-iphoneos/OpenJumpApple.app"
          OUT="$RUNNER_TEMP/apple-device-unsigned"
          mkdir -p "$OUT"
          python3 apple/ci/package_device_ipa.py \
            --app "$APP" \
            --ipa "$OUT/OpenJumpApple-experimental-unsigned.ipa" \
            --manifest "$OUT/manifest.json" \
            --sha256-file "$OUT/OpenJumpApple-experimental-unsigned.ipa.sha256" \
            --source-sha "$GITHUB_SHA"
          cat > "$OUT/EXPERIMENTAL.txt" <<'EOF'
          EXPERIMENTAL MANUAL-TEST CANDIDATE ONLY — NOT A VALIDATED RELEASE.
          CANDIDATO EXPERIMENTAL PARA PRUEBA MANUAL — NO ES UNA RELEASE VALIDADA.
          The XCTest suite (134 authored tests) was NOT RUN in this workflow; native qualification is PENDING.
          Job green means only build plus binary-structure validation passed (ARM64, iOS platform, minimum 16.0, unsigned checks).
          Unsigned artifact: NOT installable as-is; requires the downloader's own local signing (for example AltStore Classic with the user's own Apple account via AltServer).
          Keep the same Apple account and App ID and update without uninstalling when possible; there is NO guarantee the system keeps app identity/data if the resigner rewrites it.
          ARM64 with minimum iOS 16 declared does NOT prove physical iOS 16 behavior.
          This build is NOT a restore/recovery tool and NOT clinical validation.
          Back up the device before testing and test with a disposable, non-sensitive profile and non-sensitive video only.
          No claim is made that the binary is free of personal data from fixture/demo assumptions; Release fixture absence is checked later from the built binary.
          EOF
          {
            echo '## iPhone device EXPERIMENTAL unsigned build'
            echo 'EXPERIMENTAL manual-test candidate only; NOT a validated release. XCTest suite NOT RUN in this workflow; native qualification PENDING.'
            echo 'Job green means only build plus binary-structure validation passed (ARM64, iOS platform, minimum 16.0, unsigned checks).'
            echo 'Unsigned artifact is NOT installable as-is; it requires the downloader own local signing (for example AltStore Classic with the user own Apple account). Keep the same account and App ID and update without uninstalling; identity retention is NOT guaranteed if the resigner rewrites it.'
            echo 'ARM64 with minimum iOS 16 declared does NOT prove physical iOS 16 behavior. Not a restore/recovery tool. Back up before testing and use a disposable non-sensitive profile/video.'
            cat "$OUT/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload experimental unsigned device artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iPhone-device-EXPERIMENTAL-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-device-unsigned/OpenJumpApple-experimental-unsigned.ipa
            ${{ runner.temp }}/apple-device-unsigned/manifest.json
            ${{ runner.temp }}/apple-device-unsigned/OpenJumpApple-experimental-unsigned.ipa.sha256
            ${{ runner.temp }}/apple-device-unsigned/EXPERIMENTAL.txt
          if-no-files-found: error
          retention-days: 3
